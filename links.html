<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Links — Jose Luna. Student, builder, homelab enjoyer."
        />
        <title>Links · Jose Luna</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #09090b;
                --bg-elevated: #121214;
                --text-primary: #f4f4f5;
                --text-secondary: #a1a1aa;
                --text-muted: #71717a;
                --accent: #00c896;
                --border: #27272a;
                --font-mono: "JetBrains Mono", monospace;
                --font-sans: "Space Grotesk", system-ui, sans-serif;
            }

            html {
                scroll-behavior: smooth;
                background: var(--bg);
                color: var(--text-primary);
                font-family: var(--font-sans);
                font-size: 16px;
                line-height: 1.6;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            body {
                position: relative;
                min-height: 100dvh;
            }

            .noise {
                position: fixed;
                inset: 0;
                z-index: 9999;
                pointer-events: none;
                opacity: 0.035;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            }

            .grid-bg {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                opacity: 0.025;
                background-image:
                    linear-gradient(
                        rgba(255, 255, 255, 0.1) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.1) 1px,
                        transparent 1px
                    );
                background-size: 60px 60px;
            }

            .container {
                position: relative;
                z-index: 1;
                max-width: 640px;
                margin: 0 auto;
                padding: 0 1.5rem;
            }

            section {
                padding: 4rem 0;
            }

            h1,
            h2,
            h3 {
                font-family: var(--font-mono);
                font-weight: 700;
                line-height: 1.15;
            }

            h2 {
                font-size: 1.2rem;
                color: var(--accent);
                margin-bottom: 1.25rem;
                letter-spacing: -0.02em;
            }

            h2::before {
                content: "▸ ";
                font-size: 1rem;
            }

            a {
                color: var(--text-secondary);
                text-decoration: none;
                transition: color 0.2s ease;
            }

            a:hover,
            a:focus-visible {
                color: var(--accent);
            }

            a:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                border-radius: 2px;
            }

            .hero {
                display: flex;
                align-items: center;
                min-height: 100dvh;
                padding-top: 0;
            }

            .hero-inner {
                width: 100%;
            }

            .hero-name {
                font-family: var(--font-mono);
                font-size: clamp(2rem, 5vw, 3.5rem);
                font-weight: 700;
                letter-spacing: -0.03em;
                margin-bottom: 0.5rem;
            }

            .hero-sub {
                font-family: var(--font-mono);
                font-size: clamp(0.95rem, 1.5vw, 1.1rem);
                color: var(--accent);
                margin-bottom: 0.5rem;
            }

            .hero-sub .cursor {
                display: inline-block;
                width: 2px;
                height: 1em;
                background: var(--accent);
                margin-left: 2px;
                vertical-align: text-bottom;
                animation: blink 1s step-end infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

            .hero-desc {
                color: var(--text-muted);
                font-size: 0.95rem;
                margin-bottom: 2.5rem;
            }

            .links-grid {
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }

            .link-card {
                display: flex;
                align-items: center;
                gap: 1rem;
                background: var(--bg-elevated);
                border: 1px solid var(--border);
                border-radius: 0.75rem;
                padding: 1rem 1.25rem;
                transition:
                    transform 0.2s ease,
                    border-color 0.2s ease;
                cursor: pointer;
            }

            .link-card:hover {
                transform: translateY(-2px);
                border-color: rgba(0, 200, 150, 0.4);
            }

            .link-card svg {
                width: 22px;
                height: 22px;
                color: var(--accent);
                flex-shrink: 0;
            }

            .link-card .link-label {
                font-family: var(--font-mono);
                font-size: 0.95rem;
                font-weight: 500;
                color: var(--text-primary);
                flex: 1;
            }

            .link-card .link-meta {
                font-family: var(--font-mono);
                font-size: 0.75rem;
                color: var(--text-muted);
                text-align: right;
            }

            .divider-label {
                font-family: var(--font-mono);
                font-size: 0.75rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                padding: 0.75rem 0 0.25rem;
            }

            .back-link {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
                font-family: var(--font-mono);
                font-size: 0.85rem;
                color: var(--text-secondary);
                margin-top: 2.5rem;
                transition: color 0.2s ease;
            }

            .back-link:hover {
                color: var(--accent);
            }

            .back-link svg {
                width: 16px;
                height: 16px;
            }

            .footer-note {
                font-family: var(--font-mono);
                font-size: 0.7rem;
                color: var(--text-muted);
                text-align: center;
                padding: 2rem 0 3rem;
            }

            .reveal {
                opacity: 0;
                transform: translateY(16px);
                transition:
                    opacity 0.6s ease-out,
                    transform 0.6s ease-out;
            }

            .reveal.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .stagger-1 {
                transition-delay: 0.05s;
            }
            .stagger-2 {
                transition-delay: 0.12s;
            }
            .stagger-3 {
                transition-delay: 0.19s;
            }
            .stagger-4 {
                transition-delay: 0.26s;
            }
            .stagger-5 {
                transition-delay: 0.33s;
            }

            @media (prefers-reduced-motion: reduce) {
                .reveal {
                    opacity: 1;
                    transform: none;
                    transition: none;
                }
                .link-card:hover {
                    transform: none;
                }
                .cursor {
                    animation: none;
                }
            }

            @media (max-width: 768px) {
                section {
                    padding: 3rem 0;
                }
                .hero {
                    min-height: auto;
                    padding-top: 3rem;
                    padding-bottom: 1.5rem;
                }
                .link-card {
                    padding: 0.85rem 1rem;
                }
                .link-card .link-meta {
                    display: none;
                }
            }

            @media (max-width: 480px) {
                .container {
                    padding: 0 1rem;
                }

                section {
                    padding: 2rem 0;
                }

                .hero {
                    padding-top: 2rem;
                    padding-bottom: 1rem;
                }

                .hero-name {
                    font-size: 1.75rem;
                }

                .hero-sub {
                    font-size: 0.9rem;
                }

                .hero-desc {
                    font-size: 0.85rem;
                    margin-bottom: 1.75rem;
                }

                .links-grid {
                    gap: 0.6rem;
                }

                .link-card {
                    padding: 0.75rem 0.85rem;
                    gap: 0.75rem;
                }

                .link-card svg {
                    width: 18px;
                    height: 18px;
                }

                .link-card .link-label {
                    font-size: 0.875rem;
                }

                .divider-label {
                    font-size: 0.7rem;
                    padding: 0.5rem 0 0.15rem;
                }

                .back-link {
                    font-size: 0.8rem;
                    margin-top: 1.75rem;
                }

                .footer-note {
                    padding: 1.5rem 0 2rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="noise" aria-hidden="true"></div>
        <div class="grid-bg" aria-hidden="true"></div>

        <main class="container">
            <section class="hero reveal stagger-1">
                <div class="hero-inner">
                    <h1 class="hero-name">Jose Luna</h1>
                    <p class="hero-sub">
                        Student. Builder. Homelab enjoyer.<span class="cursor"
                            >&nbsp;</span
                        >
                    </p>
                    <p class="hero-desc">Santiago, Chile · quick links</p>

                    <div class="links-grid">
                        <div class="divider-label">Social</div>

                        <a
                            href="https://github.com/chachoCL"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="link-card"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                                />
                            </svg>
                            <span class="link-label">GitHub</span>
                            <span class="link-meta">@chachoCL</span>
                        </a>

                        <a
                            href="https://www.linkedin.com/in/jose-luna-b56239143/"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="link-card"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
                                />
                                <rect width="4" height="12" x="2" y="9" />
                                <circle cx="4" cy="4" r="2" />
                            </svg>
                            <span class="link-label">LinkedIn</span>
                            <span class="link-meta"
                                >/in/jose-luna-b56239143</span
                            >
                        </a>

                        <a href="mailto:jose@joseluna.dev" class="link-card">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    width="20"
                                    height="16"
                                    x="2"
                                    y="4"
                                    rx="2"
                                />
                                <path
                                    d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"
                                />
                            </svg>
                            <span class="link-label">Email</span>
                            <span class="link-meta">jose@joseluna.dev</span>
                        </a>

                        <div class="divider-label">Projects</div>

                        <a
                            href="https://github.com/chachoCL/monfit"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="link-card"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"
                                />
                                <polygon
                                    points="18 2 22 6 12 16 8 16 8 12 18 2"
                                />
                                <line x1="12" y1="8" x2="18" y2="2" />
                            </svg>
                            <span class="link-label">MonFit</span>
                            <span class="link-meta"
                                >self-hostable nutrition tracker</span
                            >
                        </a>

                        <a
                            href="https://github.com/chachoCL/lanking"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="link-card"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    width="18"
                                    height="18"
                                    x="3"
                                    y="3"
                                    rx="2"
                                />
                                <path d="M3 9h18" />
                                <path d="M9 21V9" />
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="1"
                                    fill="currentColor"
                                />
                                <circle
                                    cx="16"
                                    cy="12"
                                    r="1"
                                    fill="currentColor"
                                />
                                <circle
                                    cx="8"
                                    cy="12"
                                    r="1"
                                    fill="currentColor"
                                />
                            </svg>
                            <span class="link-label">Lanking</span>
                            <span class="link-meta">finance aggregator</span>
                        </a>
                    </div>

                    <a href="/" class="back-link">
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="19" y1="12" x2="5" y2="12" />
                            <polyline points="12 19 5 12 12 5" />
                        </svg>
                        back home
                    </a>
                </div>
            </section>
        </main>

        <p class="footer-note">Jose Luna</p>

        <script>
            const observer = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("visible");
                        }
                    });
                },
                { threshold: 0.15, rootMargin: "0px 0px -40px 0px" },
            );

            document
                .querySelectorAll(".reveal")
                .forEach((el) => observer.observe(el));

            const hero = document.querySelector(".hero");
            if (hero) {
                setTimeout(() => {
                    hero.classList.add("visible");
                }, 80);
            }
        </script>
    </body>
</html>
